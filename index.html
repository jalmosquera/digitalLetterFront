    <style>
      /* Loading inicial - Aparece instantáneamente */
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        transition: opacity 400ms;
      }

      @media (prefers-color-scheme: dark) {
        #initial-loader {
          background-color: #1a1a1a;
        }

        #initial-loader .loader-text-primary {
          color: #ffffff;
        }

        #initial-loader .loader-text-secondary {
          color: #a9a9a9;
        }
      }

      @keyframes panTilt {
        0% {
          transform: translateY(0) rotate(-4deg);
        }

        25% {
          transform: translateY(-2px) rotate(0deg);
        }

        50% {
          transform: translateY(0) rotate(4deg);
        }

        75% {
          transform: translateY(-2px) rotate(0deg);
        }

        100% {
          transform: translateY(0) rotate(-4deg);
        }
      }

      @keyframes tossA {
        0% {
          transform: translate(-16px, 0) rotate(-20deg);
        }

        30% {
          transform: translate(-40px, -80px) rotate(20deg);
        }

        65% {
          transform: translate(-16px, -4px) rotate(60deg);
        }

        100% {
          transform: translate(-16px, 0) rotate(90deg);
        }
      }

      @keyframes tossB {
        0% {
          transform: translate(0, 0) rotate(-10deg);
        }

        28% {
          transform: translate(0, -90px) rotate(10deg);
        }

        62% {
          transform: translate(0, -6px) rotate(40deg);
        }

        100% {
          transform: translate(0, 0) rotate(80deg);
        }
      }

      @keyframes tossC {
        0% {
          transform: translate(16px, 0) rotate(20deg);
        }

        30% {
          transform: translate(40px, -80px) rotate(-20deg);
        }

        65% {
          transform: translate(16px, -4px) rotate(-60deg);
        }

        100% {
          transform: translate(16px, 0) rotate(-90deg);
        }
      }

      .loader-pan-svg {
        animation: panTilt 1.6s ease-in-out infinite;
        transform-origin: 50% 85%;
      }

      .loader-ingredient {
        animation-timing-function: cubic-bezier(0.15, 0.85, 0.25, 1);
        animation-iteration-count: infinite;
        position: absolute;
        bottom: 35px;
        left: 50%;
        width: 18px;
        height: 18px;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
      }

      .loader-i1 {
        animation: tossA 1.6s infinite;
      }

      .loader-i2 {
        animation: tossB 1.8s infinite;
        animation-delay: 0.25s;
      }

      .loader-i3 {
        animation: tossC 1.5s infinite;
        animation-delay: 0.45s;
      }

      .loader-i4 {
        animation: tossA 1.7s infinite;
        animation-delay: 0.6s;
      }

      .loader-text-primary {
        color: #1f2937;
      }

      .loader-text-secondary {
        color: #9ca3af;
      }

      #initial-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
